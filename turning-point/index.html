<!DOCTYPE html><html><head><meta charset="utf-8"><title>Turning Point</title></head><body>
<p>Loading Turning Point…</p>
<script>
(async()=>{
  const n=5;
  let s='';
  for(let i=0;i<n;i++){
    s += await (await fetch('p'+i+'.txt')).text();
  }
  document.open(); document.write(s); document.close();
})();
</script></body></html>
